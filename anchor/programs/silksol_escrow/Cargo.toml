[package]
name = "silksol_escrow"
version = "0.1.0"
description = "SilkSol parametric freight-delay escrow vault"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "silksol_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
